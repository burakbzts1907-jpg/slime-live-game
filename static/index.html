<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slime Live Oyunu</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 { margin: 5px; font-size: 1.5rem; }
        #game-container {
            position: relative;
            width: 300px;
            height: 350px;
            border: 4px solid #444;
            border-bottom-left-radius: 100px;
            border-bottom-right-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        #slime {
            width: 90%;
            height: 60%;
            background: pink;
            border-top-left-radius: 150px;
            border-top-right-radius: 150px;
            transition: background 0.5s, height 0.5s;
            animation: squish 3s infinite alternate ease-in-out;
        }
        @keyframes squish {
            0% { transform: scale(1, 1); }
            100% { transform: scale(1.05, 0.95); }
        }
        #controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 8px 12px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #ff3377; }
        #logs {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #aaa;
            height: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Slime Live Oyunu</h1>
    <div id="logs">Bağlantı bekleniyor...</div>

    <div id="game-container">
        <div id="slime"></div>
    </div>

    <div id="controls">
        <button onclick="sendTest('tutkal')">Tutkal Ekle</button>
        <button onclick="sendTest('su')">Su Ekle</button>
        <button onclick="sendTest('ketchup')">Ketçap Ekle</button>
        <button onclick="sendTest('like')">Beğeni Gönder</button>
    </div>

    <script>
        const logs = document.getElementById('logs');
        const slime = document.getElementById('slime');
        
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            logs.innerText = data.message || "Etkileşim alındı!";
            if(data.type === 'ketchup') {
                slime.style.background = '#d32f2f';
            } else if(data.type === 'su') {
                slime.style.height = '50%';
            } else if(data.type === 'tutkal') {
                slime.style.background = 'pink';
                slime.style.height = '65%';
            }
        };

        function sendTest(action) {
            if(ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({action: action}));
            } else {
                logs.innerText = "WebSocket bağlı değil!";
            }
        }
    </script>
</body>
          </html>
